<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wetin Tinubu Don Do Sef · Radio</title>
<meta name="description" content="Wetin Tinubu Don Do Sef on Radio Nigeria Network (Kapital FM 92.9): listen live and play every past episode.">
<meta name="theme-color" content="#2f5bea">
<link rel="alternate" type="application/rss+xml" title="Wetin Tinubu Don Do Sef (podcast)" href="/radio/feed.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/radio/styles.css?v=1">
<!--
  Radio page (Caddy file_server from /opt/zoni/radio). episodes.json, feed.xml and recordings are written by Zoni.
  Live stream does not autoplay; user must tap Listen live. Times are Africa/Lagos (WAT).
-->
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="back" href="/" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to Zoni</a>
    <span class="brand">PBAT · Radio</span>
  </div>

  <section class="live-card" aria-labelledby="title">
    <div class="live-hero">
      <div class="live-visual">
        <button type="button" class="live-btn" id="live-circle" aria-label="Play the live stream"></button>
        <span class="live-waves" aria-hidden="true"></span>
      </div>
      <div class="live-copy">
        <p class="kicker">Radio</p>
        <div class="live-title-row">
          <h1 id="title">Wetin Tinubu Don Do Sef</h1>
          <span class="onair" id="onair-badge" hidden><i></i>ON AIR</span>
        </div>
        <p class="sub" id="sub">Radio Nigeria Network · Kapital FM 92.9 · 8:45 AM</p>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="live-actions">
      <button type="button" class="btn-live" id="listen">Listen live</button>
      <label class="vol"><span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Live volume" disabled></label>
      <span class="msg" id="msg" role="status"></span>
    </div>
  </section>

  <section aria-labelledby="eps-h">
    <div class="section-head">
      <h2 id="eps-h">Past episodes</h2>
      <a class="fine" href="/radio/feed.xml">Podcast feed</a>
    </div>
    <ul class="ep-grid" id="ep-grid"><li class="empty">Loading episodes…</li></ul>
  </section>

  <p class="foot">Times are Nigeria time (WAT). The station plays all day; the programme is on in its slot.</p>
</div>

<audio id="live-audio" preload="none" playsinline hidden></audio>

<div class="ep-player" id="ep-player" hidden>
  <div class="in">
    <div class="ep-now"><span id="ep-now"></span><button type="button" class="linkish" id="stop-ep">Stop</button></div>
    <video id="ep-video" controls playsinline preload="metadata" poster="/radio/assets/poster.svg" hidden></video>
    <audio id="ep-audio" controls preload="metadata" hidden></audio>
  </div>
</div>

<script src="/radio/app.js?v=1"></script>
</body>
</html>
