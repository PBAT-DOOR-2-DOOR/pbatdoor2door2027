<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("pbat-me")){var d=document.documentElement;d.classList.add("signed-in");setTimeout(function(){d.classList.add("nav-ready","page-ready")},3000)}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like &amp; share · PBAT DOOR TO DOOR</title>
<meta name="description" content="Today's posts, videos and news about the PBAT Door to Door Movement. Like, follow and share them in one tap.">
<meta name="theme-color" content="#06492a">
<link rel="canonical" href="https://pbatdoor2door2027.org/share">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<nav class="nav" id="site-nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="PBAT Door to Door home">
      <img class="brand-logo" src="/images/logo-transparent.png" alt="PBAT Door to Door Movement 2027" width="900" height="563">
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#events">Events</a>
      <a href="/#movement">Movement</a>
      <a href="/#about">The President</a>
      <a href="/#works">His works</a>
      <a href="/#gallery">Gallery</a>
      <a href="/#videos">Videos</a>
    </div>
    <div class="nav-auth" id="nav-auth">
      <a class="nav-link" href="/login">Log in</a>
      <a class="btn small" href="/join">Join now</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-drawer" id="nav-drawer" hidden></div>
</nav>

<main class="share-page" id="main">
  <div class="wrap">
    <p class="eyebrow">Like &amp; share</p>
    <h1>Every post about the movement, in one place</h1>
    <p class="lede">Open a post, like it and share it with your contacts. New posts, videos and news are added every few hours.</p>
    <div class="share-filters" role="group" aria-label="Filter posts">
      <button type="button" class="share-chip" data-plat="all" data-label="All" aria-pressed="true">All</button>
      <button type="button" class="share-chip" data-plat="facebook" data-label="Facebook" aria-pressed="false">Facebook</button>
      <button type="button" class="share-chip" data-plat="instagram" data-label="Instagram" aria-pressed="false">Instagram</button>
      <button type="button" class="share-chip" data-plat="tiktok" data-label="TikTok" aria-pressed="false">TikTok</button>
      <button type="button" class="share-chip" data-plat="youtube" data-label="YouTube" aria-pressed="false">YouTube</button>
      <button type="button" class="share-chip" data-plat="x" data-label="X" aria-pressed="false">X</button>
      <button type="button" class="share-chip" data-plat="web" data-label="News" aria-pressed="false">News</button>
      <label class="share-hide"><input type="checkbox" id="hide-opened"> Hide ones I've opened</label>
    </div>
    <p class="share-status" id="share-status" role="status">Loading posts…</p>
    <div class="share-list" id="share-list"></div>
  </div>
</main>

<footer class="site" id="site-footer"></footer>

<script type="module" src="/share-page.js"></script>
</body>
</html>
